name: CI

on:
  push:
    branches: ["m5-s1-**", "m5-s2-**", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  agent-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_agent_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 02_agent_api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Variables de entorno de ejemplo
        run: cp .env.example .env
      - name: Tests (incluye red team determinista)
        env:
          OPENAI_API_KEY: sk-test
          GROQ_API_KEY: gsk_test
        run: pytest -q

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_mcp_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 03_mcp_server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          OPENAI_API_KEY: sk-test
        run: pytest -q
