name: Red team (Promptfoo)

# Manual o semanal. Usa claves reales, por eso no corre en cada PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    if: ${{ vars.REDTEAM_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Levantar el agente
        working-directory: 02_agent_api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install -r requirements.txt
          nohup uvicorn src.main:app --port 8080 > /tmp/agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/docs >/dev/null && break; sleep 2; done
      - name: Promptfoo redteam
        working-directory: 05_red_team
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx -y promptfoo@latest redteam run --output redteam-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-results
          path: 05_red_team/redteam-results.json
